name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/imageshow
      TCR_IMAGE: ccr.ccs.tencentyun.com/${{ secrets.TCR_NAMESPACE }}/imageshow
      ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/imageshow
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only runs for v* tags, got: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${package_version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Validate reusable dev image
        id: reusable_image
        shell: bash
        run: |
          set -euo pipefail
          revision_key="org.opencontainers.image.revision"
          digest_pattern='^sha256:[0-9a-f]{64}$'

          validate_dev_image() {
            local image="$1"
            local output_name="$2"
            local raw_manifest descriptor revision digest

            descriptor="$(docker buildx imagetools inspect "${image}:dev" \
              --format '{{json .Manifest}}' 2>/dev/null || true)"
            digest="$(jq -r '.digest // empty' <<< "${descriptor}" 2>/dev/null || true)"

            if [[ ! "${digest}" =~ ${digest_pattern} ]]; then
              echo "${image}:dev mismatch: revision=missing, digest=${digest:-missing}" >&2
              return 1
            fi

            raw_manifest="$(docker buildx imagetools inspect "${image}@${digest}" \
              --raw 2>/dev/null || true)"
            revision="$(jq -r --arg key "${revision_key}" \
              '.annotations[$key] // empty' <<< "${raw_manifest}" 2>/dev/null || true)"

            if [[ "${revision}" == "${GITHUB_SHA}" ]]; then
              echo "${output_name}=${digest}" >> "${GITHUB_OUTPUT}"
              return 0
            fi

            echo "${image}:dev mismatch: revision=${revision:-missing}, digest=${digest:-missing}" >&2
            return 1
          }

          validation_failed=0
          validate_dev_image "${DOCKER_HUB_IMAGE}" docker_hub_digest || validation_failed=1
          validate_dev_image "${TCR_IMAGE}" tcr_digest || validation_failed=1
          validate_dev_image "${ACR_IMAGE}" acr_digest || validation_failed=1

          if (( validation_failed )); then
            echo "The current dev image does not match ${GITHUB_SHA}; refusing to publish the release." >&2
            exit 1
          fi

          echo "Reusing the current dev image from all registries."

      - name: Add release tags to current dev image
        shell: bash
        env:
          DOCKER_HUB_DIGEST: ${{ steps.reusable_image.outputs.docker_hub_digest }}
          TCR_DIGEST: ${{ steps.reusable_image.outputs.tcr_digest }}
          ACR_DIGEST: ${{ steps.reusable_image.outputs.acr_digest }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKER_HUB_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${DOCKER_HUB_IMAGE}:latest" \
            "${DOCKER_HUB_IMAGE}@${DOCKER_HUB_DIGEST}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${TCR_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${TCR_IMAGE}:latest" \
            "${TCR_IMAGE}@${TCR_DIGEST}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${ACR_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${ACR_IMAGE}:latest" \
            "${ACR_IMAGE}@${ACR_DIGEST}"

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format=%b > "${notes_file}"
          if ! grep -q '[^[:space:]]' "${notes_file}"; then
            echo "${GITHUB_REF_NAME}" > "${notes_file}"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          fi
