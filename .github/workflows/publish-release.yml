name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/imageshow
      TCR_IMAGE: ccr.ccs.tencentyun.com/${{ secrets.TCR_NAMESPACE }}/imageshow
      ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/imageshow
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate complete version and release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow only runs for v* tags, got: ${GITHUB_REF}" >&2
            exit 1
          fi
          node scripts/tests/verify/version-contract.mjs --tag "${GITHUB_REF_NAME}"
          # Only the current main head may move latest, so re-running an older
          # release cannot roll the registries back.
          main_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${main_head}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but main is at ${main_head:-unknown}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Validate reusable dev image
        id: reusable_image
        shell: bash
        run: |
          set -euo pipefail
          revision_key="org.opencontainers.image.revision"
          digest_pattern='^sha256:[0-9a-f]{64}$'
          valid_digests=()

          validate_dev_image() {
            local image="$1"
            local raw_manifest descriptor revision digest

            descriptor="$(docker buildx imagetools inspect "${image}:dev" \
              --format '{{json .Manifest}}' 2>/dev/null || true)"
            digest="$(jq -r '.digest // empty' <<< "${descriptor}" 2>/dev/null || true)"

            if [[ ! "${digest}" =~ ${digest_pattern} ]]; then
              echo "${image}:dev mismatch: revision=missing, digest=${digest:-missing}" >&2
              return 1
            fi

            raw_manifest="$(docker buildx imagetools inspect "${image}@${digest}" \
              --raw 2>/dev/null || true)"
            revision="$(jq -r --arg key "${revision_key}" \
              '.annotations[$key] // empty' <<< "${raw_manifest}" 2>/dev/null || true)"

            if [[ "${revision}" == "${GITHUB_SHA}" ]]; then
              valid_digests+=("${digest}")
              return 0
            fi

            echo "${image}:dev mismatch: revision=${revision:-missing}, digest=${digest:-missing}" >&2
            return 1
          }

          validation_failed=0
          validate_dev_image "${DOCKER_HUB_IMAGE}" || validation_failed=1
          validate_dev_image "${TCR_IMAGE}" || validation_failed=1
          validate_dev_image "${ACR_IMAGE}" || validation_failed=1

          if (( validation_failed )); then
            echo "The current dev image does not match ${GITHUB_SHA}; refusing to publish the release." >&2
            exit 1
          fi

          # One build pushed the same image everywhere; differing digests mean a
          # registry still holds another build, so nothing is published.
          digest="$(printf '%s\n' "${valid_digests[@]}" | sort -u)"
          if [[ "$(wc -l <<< "${digest}")" -ne 1 ]]; then
            echo "Registries serve different dev images for ${GITHUB_SHA}: ${valid_digests[*]}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

          echo "Reusing the current dev image ${digest} from all registries."

      - name: Publish release tags
        shell: bash
        env:
          DIGEST: ${{ steps.reusable_image.outputs.digest }}
        run: |
          set -euo pipefail

          tag_digest() {
            local descriptor
            descriptor="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null || true)"
            jq -r '.digest // empty' <<< "${descriptor}" 2>/dev/null || true
          }

          # A registry may serve a just-written tag a moment late.
          read_back() {
            local reference="$1" attempt published=""
            for attempt in 1 2 3 4 5; do
              published="$(tag_digest "${reference}")"
              [[ "${published}" == "${DIGEST}" ]] && return 0
              sleep 3
            done
            echo "${reference} reads back ${published:-missing}, expected ${DIGEST}" >&2
            return 1
          }

          # Tag one registry, then read every new tag back before the next stage.
          publish_tags() {
            local image="$1"
            shift
            local tag args=()
            for tag in "$@"; do args+=(--tag "${image}:${tag}"); done
            docker buildx imagetools create --prefer-index=false "${args[@]}" "${image}@${DIGEST}"
            for tag in "$@"; do
              read_back "${image}:${tag}" || exit 1
            done
          }

          # Docker Hub keeps every version tag. An existing tag may only be
          # re-published with the same image, which lets a failed run retry.
          existing="$(tag_digest "${DOCKER_HUB_IMAGE}:${GITHUB_REF_NAME}")"
          if [[ -n "${existing}" && "${existing}" != "${DIGEST}" ]]; then
            echo "${DOCKER_HUB_IMAGE}:${GITHUB_REF_NAME} already points to ${existing}; refusing to replace it with ${DIGEST}" >&2
            exit 1
          fi
          publish_tags "${DOCKER_HUB_IMAGE}" "${GITHUB_REF_NAME}" latest

          # The cloud mirrors only keep the latest and dev cursors.
          publish_tags "${TCR_IMAGE}" latest
          publish_tags "${ACR_IMAGE}" latest

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          git log -1 --format=%b > "${notes_file}"
          if ! grep -q '[^[:space:]]' "${notes_file}"; then
            echo "${GITHUB_REF_NAME}" > "${notes_file}"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          fi
