services:
  postgresql:
    image: postgres:18
    container_name: imageshow-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-imageshow}
      POSTGRES_USER: ${DATABASE_USER:-imageshow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-imageshow}
    volumes:
      - postgresql18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: imageshow-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  imageshow:
    image: wozsun/imageshow:latest
    container_name: imageshow
    restart: unless-stopped
    stop_grace_period: 50s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-imageshow}
      DATABASE_USER: ${DATABASE_USER:-imageshow}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-imageshow}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ImageShow123}
    ports:
      - "127.0.0.1:5518:5518"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  postgresql18_data:
  redis_data:
